<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>RSI Posisjoner</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    label { font-weight: bold; }
    input { width: 100%; padding: 8px; margin: 6px 0 16px; box-sizing: border-box; font-size: 16px; }
    .btn-green { background: #2ea44f; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; }
    .btn-red { background: #d93025; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; }
    #melding { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxYQ2BTRwCYfZUpTZuqmMt9nJs6r212y1_yNje8ZMb5l_AT3x8ueFo62Bff0fBXIU1y/exec";
    const params = new URLSearchParams(window.location.search);
    const action = params.get("action");
    const ticker = params.get("ticker") || "";
    const navn = params.get("navn") || "";

    if (action === "selg") {
      visSelgSkjema(ticker, navn);
    } else {
      visKjopSkjema(ticker, navn);
    }

    function visKjopSkjema(ticker, navn) {
      document.getElementById("app").innerHTML = `
        <h2>📈 Legg til posisjon</h2>
        <label>Ticker</label>
        <input type="text" id="ticker" value="${ticker}" placeholder="f.eks. EQNR.OL">
        <label>Navn</label>
        <input type="text" id="navn" value="${navn}" placeholder="f.eks. Equinor">
        <label>Kjøpskurs</label>
        <input type="number" id="kjopskurs" placeholder="f.eks. 285.50" step="0.01">
        <label>Antall aksjer</label>
        <input type="number" id="antall" placeholder="f.eks. 100">
        <button class="btn-green" onclick="lagrePositon()">Lagre posisjon</button>
        <div id="melding"></div>
      `;
    }

    function visSelgSkjema(ticker, navn) {
      document.getElementById("app").innerHTML = `
        <h2>🔴 Selg posisjon</h2>
        <p>Selger: <b>${navn} (${ticker})</b></p>
        <label>Salgskurs</label>
        <input type="number" id="salgskurs" placeholder="f.eks. 310.50" step="0.01">
        <label>Antall solgt</label>
        <input type="number" id="antall_solgt" placeholder="f.eks. 10">
        <button class="btn-red" onclick="selgPositon('${ticker}', '${navn}')">Bekreft salg</button>
        <div id="melding"></div>
      `;
    }

    async function lagrePositon() {
      const ticker = document.getElementById("ticker").value.trim();
      const navn = document.getElementById("navn").value.trim();
      const kjopskurs = parseFloat(document.getElementById("kjopskurs").value);
      const antall = parseInt(document.getElementById("antall").value);

      if (!ticker || !navn || !kjopskurs || !antall) {
        document.getElementById("melding").innerText = "⚠️ Fyll inn alle felt!";
        return;
      }

      document.getElementById("melding").innerText = "Lagrer...";

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ticker, navn, kjopskurs, antall })
        });
        document.getElementById("melding").innerHTML = `✅ <b>${navn}</b> lagret!`;
      } catch (err) {
        document.getElementById("melding").innerText = "❌ Feil ved lagring.";
      }
    }

    function selgPositon(ticker, navn) {
      const salgskurs = parseFloat(document.getElementById("salgskurs").value.replace(",", "."));
      const antall_solgt = parseInt(document.getElementById("antall_solgt").value);

      if (!salgskurs || !antall_solgt) {
        document.getElementById("melding").innerText = "⚠️ Fyll inn salgskurs og antall!";
        return;
      }

      const url = `${API_URL}?action=selg&ticker=${encodeURIComponent(ticker)}&salgskurs=${salgskurs}&antall_solgt=${antall_solgt}`;
      window.open(url, "_blank");

      document.getElementById("melding").innerHTML = `✅ <b>${navn} (${ticker})</b> solgt!`;
      document.querySelector("button").disabled = true;
    }
  </script>
</body>
</html>
